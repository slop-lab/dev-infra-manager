name: Verify development repository set

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-set:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@8796955f39fc2564b293d284fed927e7bf98c8e4
    with:
      candidate-repository: development
      candidate-ref: ${{ gitea.sha }}
