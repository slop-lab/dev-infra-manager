name: Verify root repository set

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-set:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@310ca9071f9d2a3e9ed94287bb3b297f9ce8cfb3
    with:
      candidate-repository: root
      candidate-ref: ${{ gitea.sha }}
      verification-ref: 310ca9071f9d2a3e9ed94287bb3b297f9ce8cfb3

  persistent-state-integration:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@310ca9071f9d2a3e9ed94287bb3b297f9ce8cfb3
    with:
      candidate-repository: root
      candidate-ref: ${{ gitea.sha }}
      verification-ref: 310ca9071f9d2a3e9ed94287bb3b297f9ce8cfb3
      gate: integration
      runner-label: dim-container-integration

  local-qemu-host-gate:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@310ca9071f9d2a3e9ed94287bb3b297f9ce8cfb3
    with:
      candidate-repository: root
      candidate-ref: ${{ gitea.sha }}
      verification-ref: 310ca9071f9d2a3e9ed94287bb3b297f9ce8cfb3
      gate: kvm-control
      runner-label: dim-qemu
