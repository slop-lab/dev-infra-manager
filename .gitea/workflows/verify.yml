name: Verify development repository set

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-set:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@cf657a1aef78f05e5aef57f0f4bca81995f3c14b
    with:
      candidate-repository: development
      candidate-ref: ${{ gitea.sha }}
