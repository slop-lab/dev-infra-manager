name: Verify development repository set

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-set:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@ffb80941c355b02ebcc42eecb08e495198567ff2
    with:
      candidate-repository: development
      candidate-ref: ${{ gitea.sha }}
