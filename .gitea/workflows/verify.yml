name: Verify root repository set

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-set:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@5b84c6fa7aabc07df88cc8287f4b58b5294ae6c3
    with:
      candidate-repository: root
      candidate-ref: ${{ gitea.sha }}

  local-qemu-host-gate:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@5b84c6fa7aabc07df88cc8287f4b58b5294ae6c3
    with:
      candidate-repository: root
      candidate-ref: ${{ gitea.sha }}
      gate: kvm-control
      runner-label: dim-qemu
      backend: sysbox
