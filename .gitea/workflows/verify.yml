name: Verify root repository set

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-set:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@ba6c30d7d73c76184c5e809ac6ad6142633bb12a
    with:
      candidate-repository: root
      candidate-ref: ${{ gitea.sha }}

  local-qemu-host-gate:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@ba6c30d7d73c76184c5e809ac6ad6142633bb12a
    with:
      candidate-repository: root
      candidate-ref: ${{ gitea.sha }}
      gate: kvm-control
      runner-label: dim-qemu
      backend: sysbox
