name: Verify root repository set

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-set:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@4fbb5f7498ace1e299b6b15894afea62848851fd
    with:
      candidate-repository: root
      candidate-ref: ${{ gitea.sha }}

  local-qemu-host-gate:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@4fbb5f7498ace1e299b6b15894afea62848851fd
    with:
      candidate-repository: root
      candidate-ref: ${{ gitea.sha }}
      gate: kvm-control
      runner-label: dim-qemu
      backend: sysbox
