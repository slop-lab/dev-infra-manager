name: Verify development repository set

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-set:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@f00a09d5b67e5c5519a6429c8eb086152526530a
    with:
      candidate-repository: development
      candidate-ref: ${{ gitea.sha }}
