name: Verify root repository set

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-set:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@c3301fb3803e91d44c60d0ed32103becbb9e2c26
    with:
      candidate-repository: root
      candidate-ref: ${{ gitea.sha }}

  local-qemu-host-gate:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@c3301fb3803e91d44c60d0ed32103becbb9e2c26
    with:
      candidate-repository: root
      candidate-ref: ${{ gitea.sha }}
      gate: kvm-control
      runner-label: dim-qemu
      backend: sysbox
