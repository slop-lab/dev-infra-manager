name: Verify monorepo candidate

on:
  pull_request:
  push:
    branches: [main, feature/monorepo-one-tree]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monorepo-source:
    runs-on: dim
    timeout-minutes: 45
    steps:
      - name: Check out the exact monorepo candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dim-dim/development
          ref: ${{ gitea.sha }}
          path: snapshot
      - name: Require the reviewed verification tools
        run: |
          for tool in sed awk cmp setsid tini; do command -v "$tool"; done
      - name: Prepare disposable job paths for host-script tests
        run: |
          test "$(id -u)" -eq 0
          chmod 1777 /tmp
          for binary in /bin/*; do
            target="/usr/bin/${binary##*/}"
            test -e "$target" || ln -s "$binary" "$target"
          done
          install -d /usr/local/bin
          test -e /usr/local/bin/just || ln -s "$(command -v just)" /usr/local/bin/just
          test -e /etc/passwd || printf 'root:x:0:0:root:/root:/bin/bash\n' >/etc/passwd
          test -e /etc/group || printf 'root:x:0:\n' >/etc/group
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.13.1
      - name: Verify one-tree source and provenance
        working-directory: snapshot
        env:
          GIT_AUTHOR_NAME: DIM candidate CI
          GIT_AUTHOR_EMAIL: dim-ci@example.invalid
          GIT_COMMITTER_NAME: DIM candidate CI
          GIT_COMMITTER_EMAIL: dim-ci@example.invalid
        run: |
          test -f .monorepo-candidate/sources.tsv
          test -f .monorepo-candidate/github-development.tsv
          test -f .monorepo-candidate/overlay.digest
          git fsck --full --no-reflogs
          pnpm install --frozen-lockfile
          just typecheck
          just build-packages
          tini -s -- pnpm --dir verification run test
          tini -s -- pnpm --dir core-development run test

  monorepo-qemu:
    if: ${{ gitea.ref == 'refs/heads/feature/monorepo-one-tree' || gitea.head_ref == 'feature/monorepo-one-tree' }}
    runs-on: dim-qemu
    timeout-minutes: 120
    steps:
      - name: Check out the exact monorepo candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dim-dim/development
          ref: ${{ gitea.sha }}
          path: snapshot
      - name: Require the reviewed job-image tool
        run: |
          command -v sed
          sed --version >/dev/null
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.13.1
      - name: Verify the complete candidate in disposable nested KVM
        working-directory: snapshot
        run: |
          test -r /dev/kvm && test -w /dev/kvm
          test -f .monorepo-candidate/sources.tsv
          test -f .monorepo-candidate/github-development.tsv
          test -f .monorepo-candidate/overlay.digest
          printf 'candidate_commit=%s\ncandidate_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"
          sha256sum .monorepo-candidate/sources.tsv .monorepo-candidate/github-development.tsv .monorepo-candidate/overlay.tsv
          git fsck --full --no-reflogs
          pnpm install --frozen-lockfile
          just typecheck
          just build-packages
          DIM_QEMU_SOURCE_ROOT="$PWD" JUST_UNSTABLE=1 just verify environments-kvm
      - name: Retain candidate provenance for human review
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: monorepo-candidate-${{ gitea.sha }}
          path: snapshot/.monorepo-candidate/
          retention-days: 30
