name: Verify root repository set

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-set:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@17abe8c1b3ff2c5b0212d23678cb02868c3040b1
    with:
      candidate-repository: root
      candidate-ref: ${{ gitea.sha }}
      verification-ref: 17abe8c1b3ff2c5b0212d23678cb02868c3040b1

  persistent-state-integration:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@17abe8c1b3ff2c5b0212d23678cb02868c3040b1
    with:
      candidate-repository: root
      candidate-ref: ${{ gitea.sha }}
      verification-ref: 17abe8c1b3ff2c5b0212d23678cb02868c3040b1
      gate: integration
      runner-label: dim-container-integration

  local-qemu-host-gate:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@17abe8c1b3ff2c5b0212d23678cb02868c3040b1
    with:
      candidate-repository: root
      candidate-ref: ${{ gitea.sha }}
      verification-ref: 17abe8c1b3ff2c5b0212d23678cb02868c3040b1
      gate: kvm-control
      runner-label: dim-qemu
      backend: sysbox
