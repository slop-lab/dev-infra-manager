name: Verify root repository set

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-set:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@80ac824acd47908e337f7aea7419bde77ae4f761
    with:
      candidate-repository: root
      candidate-ref: ${{ gitea.sha }}

  local-qemu-host-gate:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@80ac824acd47908e337f7aea7419bde77ae4f761
    with:
      candidate-repository: root
      candidate-ref: ${{ gitea.sha }}
      gate: kvm-control
      runner-label: dim-qemu
      backend: sysbox
