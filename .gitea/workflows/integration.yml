name: Expensive integration

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Integration lane to run
        type: choice
        options: [all, container, kvm]
        default: all
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  container:
    if: ${{ gitea.event_name == 'schedule' || inputs.lane == 'all' || inputs.lane == 'container' }}
    uses: ./.gitea/workflows/repository-set.yml
    with:
      candidate-repository: verification
      candidate-ref: ${{ gitea.sha }}
      gate: integration
      runner-label: dim-container-integration
  kvm:
    if: ${{ gitea.event_name == 'schedule' || inputs.lane == 'all' || inputs.lane == 'kvm' }}
    uses: ./.gitea/workflows/repository-set.yml
    with:
      candidate-repository: verification
      candidate-ref: ${{ gitea.sha }}
      gate: kvm
      runner-label: dim-qemu
