name: Verify repository set

on:
  workflow_call:
    inputs:
      candidate-repository:
        type: string
        required: true
      candidate-ref:
        type: string
        required: true
      development-ref:
        type: string
        required: false
        default: ''
      root-ref:
        type: string
        required: false
        default: ''
      gate:
        type: string
        required: false
        default: source
      runner-label:
        type: string
        required: false
        default: dim
      backend:
        type: string
        required: false
        default: runc
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ inputs.runner-label || 'dim' }}
    timeout-minutes: 30
    steps:
      - name: Bootstrap Node.js for host-mode JavaScript actions
        if: ${{ inputs.gate == 'kvm' }}
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x -o /tmp/dim-nodesource-setup.bash
          sudo bash /tmp/dim-nodesource-setup.bash >/dev/null
          rm -f /tmp/dim-nodesource-setup.bash
          sudo apt-get install -y nodejs >/dev/null
          node --version
      - name: Check out development root
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dim-dim/development
          ref: ${{ inputs.development-ref || (gitea.event_name == 'workflow_call' && inputs.candidate-repository == 'development' && inputs.candidate-ref) || 'main' }}
          path: snapshot
      - name: Check out root
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dim-dim/root
          ref: ${{ inputs.root-ref || (gitea.event_name == 'workflow_call' && inputs.candidate-repository == 'root' && inputs.candidate-ref) || 'main' }}
          path: snapshot/project
      - name: Check out repositories
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dim-dim/core
          path: snapshot/core
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dim-dim/core-development
          path: snapshot/core-development
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dim-dim/plugin-dns-cloudflare
          path: snapshot/plugin-dns-cloudflare
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dim-dim/plugin-dns-cloudflare-development
          path: snapshot/plugin-dns-cloudflare-development
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dim-dim/plugin-external-urls
          path: snapshot/plugin-external-urls
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dim-dim/plugin-external-urls-development
          path: snapshot/plugin-external-urls-development
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dim-dim/verification
          ref: ${{ gitea.event_name == 'workflow_call' && inputs.candidate-repository == 'verification' && inputs.candidate-ref || gitea.event_name != 'workflow_call' && gitea.sha || 'main' }}
          path: snapshot/verification
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dim-dim/examples
          path: snapshot/examples
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dim-dim/specification
          path: snapshot/specification
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.13.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install repository-set dependencies
        working-directory: snapshot
        run: pnpm install --frozen-lockfile
      - name: Record exact repository set
        run: bash snapshot/verification/scripts/write-repository-set-evidence.bash snapshot
      - name: Upload repository-set evidence
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: repository-set-${{ gitea.sha }}-${{ inputs.gate || 'source' }}
          path: snapshot/repository-set.json
          retention-days: 30
      - name: Verify source repository set
        if: ${{ !inputs.gate || inputs.gate == 'source' }}
        working-directory: snapshot
        run: |
          bash verification/scripts/repository-materialization-smoke.bash
          pnpm run workspace:check
          pnpm run workspace:test
          pnpm run workspace:build
      - name: Verify container integration
        if: ${{ inputs.gate == 'container' }}
        working-directory: snapshot
        run: |
          dim-ci-runner-health --recover
          just check-source
          just verify workspace-runtime
          bash verification/scripts/container-cgroup-smoke.bash
      - name: Verify runner health after container integration
        if: ${{ always() && inputs.gate == 'container' }}
        run: dim-ci-runner-health --recover
      - name: Verify QEMU backend integration
        if: ${{ inputs.gate == 'kvm' }}
        working-directory: snapshot
        run: |
          test -r /dev/kvm -a -w /dev/kvm
          JUST_UNSTABLE=1 just verify environments-kvm "${{ inputs.backend }}"
