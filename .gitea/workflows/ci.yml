name: CI

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

env:
  JUST_UNSTABLE: "1"

jobs:
  check:
    name: check (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install --yes just jq
      - run: pnpm install --frozen-lockfile
      - run: just ci check

  container-integration:
    runs-on: dim-container-integration
    timeout-minutes: 30
    steps:
      - run: apk add --no-cache apparmor curl jq just nodejs npm
      - uses: actions/checkout@v7
      - run: npm install --global pnpm@10.13.1
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/install-rootlesskit-apparmor-profile-ubuntu.bash
      - run: just ci container
