name: CI

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

env:
  JUST_UNSTABLE: "1"

jobs:
  source-compatibility:
    name: source compatibility (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Select pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - name: Select Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: workbench/pnpm-lock.yaml
      - name: Install source-gate system tools
        run: sudo apt-get update && sudo apt-get install --yes just jq
      - name: Install locked dependencies
        run: pnpm --dir workbench install --frozen-lockfile
      - name: Type-check, test, build, and verify packages
        run: cd workbench && just ci source

  workspace-integration:
    name: managed workspace integration
    runs-on: dim-container-integration
    timeout-minutes: 30
    steps:
      - name: Install workspace-gate system tools
        run: apk add --no-cache curl jq just nodejs npm socat
      - name: Check out source
        uses: actions/checkout@v7
      - name: Select pnpm
        run: npm install --global pnpm@10.13.1
      - name: Install locked dependencies
        run: pnpm --dir workbench install --frozen-lockfile
      - name: Verify managed workspace lifecycle and container boundaries
        run: cd workbench && bash verification/scripts/with-ci-registry-cache.bash just ci workspace

  host-backend:
    name: host backend (${{ matrix.backend }})
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.draft == false }}
    runs-on: dim-qemu
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend: [sysbox, gvisor, rootless-podman, runc]
    steps:
      - name: Check out the reviewed commit without a JavaScript action runtime
        env:
          GITEA_JOB_TOKEN: ${{ gitea.token }}
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c http.extraHeader="Authorization: token $GITEA_JOB_TOKEN" \
            fetch --no-tags --depth=1 origin \
            "$GITHUB_SHA:refs/remotes/origin/ci-head"
          git checkout --detach refs/remotes/origin/ci-head
      - name: Verify disposable runner KVM access
        run: command -v just && test -r /dev/kvm -a -w /dev/kvm
      - name: Install registry-relay prerequisite
        run: command -v socat >/dev/null || (sudo apt-get update && sudo apt-get install --yes socat)
      - name: Install and verify the ${{ matrix.backend }} host backend in a nested VM
        run: cd workbench && bash verification/scripts/with-ci-registry-cache.bash just ci kvm "${{ matrix.backend }}"
