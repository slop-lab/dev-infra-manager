name: CI

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

env:
  JUST_UNSTABLE: "1"

jobs:
  check:
    name: check (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install --yes just jq
      - run: pnpm install --frozen-lockfile
      - run: just ci check

  container-integration:
    runs-on: dim-container-integration
    timeout-minutes: 30
    steps:
      - run: apk add --no-cache curl jq just nodejs npm socat
      - uses: actions/checkout@v7
      - run: npm install --global pnpm@10.13.1
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/with-ci-registry-cache.bash just ci container

  release-gate:
    name: release-gate (${{ matrix.backend }})
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: dim-qemu
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend: [sysbox, gvisor, rootless-podman, runc]
    steps:
      - name: Check out the reviewed commit without a JavaScript action runtime
        env:
          GITEA_JOB_TOKEN: ${{ gitea.token }}
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c http.extraHeader="Authorization: token $GITEA_JOB_TOKEN" \
            fetch --no-tags --depth=1 origin \
            "$GITHUB_SHA:refs/remotes/origin/ci-head"
          git checkout --detach refs/remotes/origin/ci-head
      - run: command -v just && test -r /dev/kvm -a -w /dev/kvm
      - run: command -v socat >/dev/null || (sudo apt-get update && sudo apt-get install --yes socat)
      - run: bash scripts/with-ci-registry-cache.bash just ci kvm "${{ matrix.backend }}"
