name: CI

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

env:
  JUST_UNSTABLE: "1"

jobs:
  check:
    name: check (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install --yes just jq
      - run: pnpm install --frozen-lockfile
      - run: just ci check

  container-integration:
    runs-on: dim-container-integration
    timeout-minutes: 30
    steps:
      - run: apk add --no-cache curl jq just nodejs npm
      - uses: actions/checkout@v7
      - run: npm install --global pnpm@10.13.1
      - run: pnpm install --frozen-lockfile
      - run: just ci container

  release-gate:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: dim-release-gate
    timeout-minutes: 120
    steps:
      - run: apk add --no-cache cloud-utils-localds curl git just openssh-client qemu-system-x86_64 tar
      - uses: actions/checkout@v7
      - run: just ci kvm
