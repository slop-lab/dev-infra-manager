name: QEMU release gate

on:
  workflow_dispatch:
    inputs:
      root-ref:
        description: Exact root branch, tag, or commit to combine with this development ref
        type: string
        required: true
        default: main

permissions:
  contents: read

jobs:
  container-integration:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@3ed44e63b9389e9d27dc09f9f7221cb645af1a5a
    with:
      candidate-repository: development
      candidate-ref: ${{ gitea.sha }}
      development-ref: ${{ gitea.sha }}
      root-ref: ${{ inputs.root-ref }}
      gate: container
      runner-label: dim-container-integration

  qemu-sysbox:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@3ed44e63b9389e9d27dc09f9f7221cb645af1a5a
    with:
      candidate-repository: development
      candidate-ref: ${{ gitea.sha }}
      development-ref: ${{ gitea.sha }}
      root-ref: ${{ inputs.root-ref }}
      gate: kvm
      runner-label: dim-qemu
