name: QEMU release gate

on:
  workflow_dispatch:
    inputs:
      root-ref:
        description: Exact root branch, tag, or commit to combine with this development ref
        type: string
        required: true
        default: main

permissions:
  contents: read

jobs:
  full-integration:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@39f05bb
    with:
      candidate-repository: development
      candidate-ref: ${{ gitea.sha }}
      development-ref: ${{ gitea.sha }}
      root-ref: ${{ inputs.root-ref }}
      gate: integration
      runner-label: dim-container-integration
      backend: runc

  qemu-runc:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@39f05bb
    with:
      candidate-repository: development
      candidate-ref: ${{ gitea.sha }}
      development-ref: ${{ gitea.sha }}
      root-ref: ${{ inputs.root-ref }}
      gate: kvm
      runner-label: dim-qemu
      backend: runc

  qemu-sysbox:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@39f05bb
    with:
      candidate-repository: development
      candidate-ref: ${{ gitea.sha }}
      development-ref: ${{ gitea.sha }}
      root-ref: ${{ inputs.root-ref }}
      gate: kvm
      runner-label: dim-qemu
      backend: sysbox

  qemu-gvisor:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@39f05bb
    with:
      candidate-repository: development
      candidate-ref: ${{ gitea.sha }}
      development-ref: ${{ gitea.sha }}
      root-ref: ${{ inputs.root-ref }}
      gate: kvm
      runner-label: dim-qemu
      backend: gvisor

  qemu-rootless-podman:
    uses: dim-dim/verification/.gitea/workflows/repository-set.yml@39f05bb
    with:
      candidate-repository: development
      candidate-ref: ${{ gitea.sha }}
      development-ref: ${{ gitea.sha }}
      root-ref: ${{ inputs.root-ref }}
      gate: kvm
      runner-label: dim-qemu
      backend: rootless-podman
