services:
  dev:
    build: ./dev
    privileged: true
    working_dir: /workspace
    env_file:
      - /tmp/dim-host-inputs.env
    environment:
      DOCKER_TLS_CERTDIR: ""
    # The agent gets its own daemon, not the project-root controller's daemon.
    # Containers created here cannot inspect or control secret-bearing siblings
    # that the controller starts at the project-root level.
    volumes:
      - dev-docker:/var/lib/docker
      - ..:/workspace

  # This proxy has no secret. It exposes only the few lifecycle operations
  # that the dev container needs for the fixed secret-bearing service.
  secret-control:
    build: ./secret-control
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  dev-docker:
