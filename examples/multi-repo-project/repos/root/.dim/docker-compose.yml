services:
  dev:
    build: ./dev
    privileged: true
    working_dir: /workspace
    env_file:
      - /tmp/dim-host-inputs.env
    environment:
      DOCKER_TLS_CERTDIR: ""
    # The agent gets its own daemon, not the project-root controller's daemon.
    # Containers created here cannot inspect or control secret-bearing siblings
    # that the controller starts at the project-root level.
    volumes:
      - dev-docker:/var/lib/docker
      - ..:/workspace

  # This service runs on the project-root daemon, never dev's private daemon.
  # The profile keeps it stopped until a trusted operator supplies the secret.
  secret:
    profiles: [secret]
    build: ${SECRET_SERVICE_CONTEXT:-/tmp/dim-controller/secrets}
    environment:
      EXAMPLE_SECRET: "${EXAMPLE_SECRET:-}"

volumes:
  dev-docker:
