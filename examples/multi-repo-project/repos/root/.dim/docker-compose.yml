services:
  # This service runs only on the trusted workspace's Project Docker daemon.
  # The host-side Sysbox agent is not a service in this Compose project.
  # The profile keeps it stopped until a trusted operator supplies the secret.
  secret:
    profiles: [secret]
    build: ${SECRET_SERVICE_CONTEXT:-/tmp/dim-controller/secrets}
    environment:
      EXAMPLE_SECRET: "${EXAMPLE_SECRET:-}"
    ports:
      - "7099:7099"
