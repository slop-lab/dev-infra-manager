services:
  agent:
    build:
      context: agent
      args:
        DIM_WORKSPACE_UID: "${DIM_WORKSPACE_UID:-1000}"
        DIM_WORKSPACE_GID: "${DIM_WORKSPACE_GID:-1000}"
    environment:
      DOCKER_HOST: "tcp://agent-dind:2375"
      DIM_DEVELOPMENT_URL_SOCKET: "/run/dim/development-url/controller.sock"
      DIM_GIT_USERNAME: "${DIM_GIT_USERNAME:?}"
      DIM_GIT_TOKEN: "${DIM_GIT_TOKEN:?}"
      # Setup supplies these when creating the agent. Defaults keep unrelated
      # profile operations (such as deploying only `secret`) composable later.
      GIT_AUTHOR_NAME: "${GIT_AUTHOR_NAME:-}"
      GIT_AUTHOR_EMAIL: "${GIT_AUTHOR_EMAIL:-}"
      GIT_COMMITTER_NAME: "${GIT_COMMITTER_NAME:-}"
      GIT_COMMITTER_EMAIL: "${GIT_COMMITTER_EMAIL:-}"
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: "!f() { echo username=$$DIM_GIT_USERNAME; echo password=$$DIM_GIT_TOKEN; }; f"
      GIT_CONFIG_KEY_1: safe.directory
      GIT_CONFIG_VALUE_1: /workspace
    volumes:
      - ${DIM_WORKSPACE_DATA:?}/project:/workspace
      - agent-home:/home/dim-agent
      - agent-dind-shared:/mnt/workspace-shared-dind
      - /tmp/dim-development-url:/run/dim/development-url:ro
      - /usr/local/lib/dim/controller-proxy:/usr/local/lib/dim/controller-proxy:ro
    expose:
      - "${DIM_DEVELOPMENT_GATEWAY_PORT:?}"
    networks:
      - default
      - agent-dind
    working_dir: /workspace
    depends_on:
      agent-dind:
        condition: service_healthy

  agent-dind:
    build:
      context: dind
    privileged: true
    environment:
      DOCKER_HOST: "tcp://127.0.0.1:2375"
      DOCKER_TLS_CERTDIR: ""
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - agent-dind-data:/home/rootless/.local/share/docker
      - agent-dind-shared:/mnt/workspace-shared-dind
    networks:
      - agent-dind

  secret:
    profiles: [secret]
    build: ${SECRET_SERVICE_CONTEXT:-/tmp/dim-controller/secrets}
    environment:
      EXAMPLE_SECRET: "${EXAMPLE_SECRET:-}"
    ports:
      - "7099:7099"

volumes:
  agent-home:
  agent-dind-data:
  # The agent and rootless DinD may use different host UIDs. The private
  # shared volume therefore has a sticky writable root, and bind-source
  # directories below it must grant access to both containers.
  agent-dind-shared:

networks:
  default:
  agent-dind:
