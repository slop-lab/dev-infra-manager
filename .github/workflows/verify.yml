name: Verify native candidate

on:
  pull_request:
  push:
    branches: [main, development, candidate/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact candidate source
        env:
          DIM_EXPECTED_CANDIDATE_SHA: ${{ github.sha }}
        run: node scripts/checks/candidate-source-evidence.mjs "$DIM_EXPECTED_CANDIDATE_SHA" /tmp/dim-candidate-source-evidence.json
      - name: Verify source and package shapes in the pinned disposable lane
        env:
          DIM_SOURCE_NODE_MAJOR: ${{ matrix.node }}
          DIM_CHECK_LOG_DIR: ${{ runner.temp }}/dim-source-checks
        run: bash scripts/checks/source-gate-container.bash
      - name: Upload source check logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-check-logs-node-${{ matrix.node }}-${{ github.sha }}
          path: ${{ runner.temp }}/dim-source-checks
          if-no-files-found: warn
          retention-days: 7
      - name: Upload exact-tree evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (Node 20)
        with:
          name: native-candidate-source-node-${{ matrix.node }}-${{ github.sha }}
          path: /tmp/dim-candidate-source-evidence.json
          if-no-files-found: error
          retention-days: 30
