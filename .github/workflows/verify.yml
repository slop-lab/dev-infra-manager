name: Verify portable candidate

on:
  pull_request:
  merge_group:
    branches: [main]
    types: [checks_requested]
  push:
    branches: [main, development, candidate/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    name: portable (Node ${{ matrix.node }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [24.19.0, 26.5.0]
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.13.1
      - name: Record exact candidate source
        env:
          DIM_EXPECTED_CANDIDATE_SHA: ${{ github.sha }}
        run: node scripts/checks/candidate-source-evidence.mjs "$DIM_EXPECTED_CANDIDATE_SHA" /tmp/dim-candidate-source-evidence.json
      - name: Verify portable contracts, transport and package shape
        env:
          DIM_CHECK_LOG_DIR: ${{ runner.temp }}/dim-portable-checks
        run: node scripts/checks/check-portable-source.ts
      - name: Upload portable check logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-check-logs-node-${{ matrix.node }}-${{ github.sha }}
          path: ${{ runner.temp }}/dim-portable-checks
          if-no-files-found: warn
          retention-days: 7
      - name: Upload exact-tree evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (Node 20)
        with:
          name: native-candidate-source-node-${{ matrix.node }}-${{ github.sha }}
          path: /tmp/dim-candidate-source-evidence.json
          if-no-files-found: error
          retention-days: 30
