name: Native integration

on:
  merge_group:
    branches: [main]
    types: [checks_requested]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      lane:
        description: Native integration lane
        type: choice
        options: [ordinary, qemu-kvm, vm-runtime]
        default: ordinary

permissions:
  contents: read

jobs:
  ordinary:
    if: ${{ inputs.lane == 'ordinary' }}
    runs-on: dim-native-ordinary
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0 (Node 20)
        with:
          version: 10.13.1
      - run: pnpm install --frozen-lockfile
      - run: just build-packages
      - run: just verify native-idle-service-images
      - run: just verify installer-artifacts
      - run: just verify native-ordinary-executor-live
  qemu-kvm:
    if: ${{ inputs.lane == 'qemu-kvm' }}
    runs-on: dim-native-qemu
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0 (Node 20)
        with:
          version: 10.13.1
      - run: pnpm install --frozen-lockfile
      - run: just build-packages
      - name: Require real KVM
        run: test -c /dev/kvm -a -r /dev/kvm -a -w /dev/kvm
      - run: just verify native-qemu-guest-mechanics-kvm
  vm-runtime-acceptance:
    if: ${{ github.event_name == 'merge_group' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.lane == 'vm-runtime') }}
    runs-on: dim-native-qemu
    timeout-minutes: 120
    env:
      DIM_TEST_KVM_IMAGE: ${{ vars.DIM_TEST_KVM_IMAGE }}
      DIM_TEST_KVM_STATE_PARENT: ${{ vars.DIM_TEST_KVM_STATE_PARENT }}
      DIM_TEST_KVM_PROBE: ${{ vars.DIM_TEST_KVM_PROBE }}
      DIM_NATIVE_MULTI_REPOSITORY_IMAGE: ${{ vars.DIM_NATIVE_MULTI_REPOSITORY_IMAGE }}
      DIM_GUEST_INTEGRATION_IMAGE: ${{ vars.DIM_GUEST_INTEGRATION_IMAGE }}
      DIM_VM_ACCEPTANCE_RECEIPT: ${{ runner.temp }}/vm-runtime-acceptance.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0 (Node 20)
        with:
          version: 10.13.1
      - run: pnpm install --frozen-lockfile
      - run: just build-packages
      - name: Run exact VM runtime acceptance
        run: just verify vm-runtime-acceptance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: vm-runtime-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/vm-runtime-acceptance.json
          if-no-files-found: error
