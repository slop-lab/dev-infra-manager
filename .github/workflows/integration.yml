name: Native integration

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Native integration lane
        type: choice
        options: [ordinary, qemu-kvm, vm-runtime, practical]
        default: ordinary

permissions:
  contents: read

jobs:
  practical-runtime-manual:
    if: ${{ inputs.lane == 'practical' }}
    runs-on: dim-native-qemu
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact candidate source
        env:
          DIM_EXPECTED_CANDIDATE_SHA: ${{ github.sha }}
          DIM_EXAMPLES_EVIDENCE: ${{ runner.temp }}/dim-practical-runtime-source.json
        run: node scripts/checks/candidate-source-evidence.mjs "$DIM_EXPECTED_CANDIDATE_SHA" "$DIM_EXAMPLES_EVIDENCE"
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 10.13.1
      - run: pnpm install --frozen-lockfile
      - run: just build-packages
      - name: Run canonical practical VM acceptance
        env:
          DIM_EXAMPLES_VM_LOG_ROOT: ${{ runner.temp }}/dim-practical-runtime-logs
        run: bash scripts/checks/examples-vm-smoke.bash
      - name: Require exact-source complete practical receipt
        env:
          DIM_EXAMPLES_VM_LOG_ROOT: ${{ runner.temp }}/dim-practical-runtime-logs
        run: node tests/scenarios/selected-host/ci/verifyEvidence.ts "$DIM_EXAMPLES_VM_LOG_ROOT" "$GITHUB_SHA" "$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: practical-runtime-logs-${{ github.sha }}
          path: ${{ runner.temp }}/dim-practical-runtime-logs
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: practical-runtime-source-${{ github.sha }}
          path: ${{ runner.temp }}/dim-practical-runtime-source.json
          if-no-files-found: error
          retention-days: 30
  ordinary:
    if: ${{ inputs.lane == 'ordinary' }}
    runs-on: dim-native-ordinary
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0 (Node 20)
        with:
          version: 10.13.1
      - run: pnpm install --frozen-lockfile
      - run: just build-packages
      - run: just verify native-idle-service-images
      - run: just verify installer-artifacts
      - run: just verify native-ordinary-executor-live
  qemu-kvm:
    if: ${{ inputs.lane == 'qemu-kvm' }}
    runs-on: dim-native-qemu
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0 (Node 20)
        with:
          version: 10.13.1
      - run: pnpm install --frozen-lockfile
      - run: just build-packages
      - name: Require real KVM
        run: test -c /dev/kvm -a -r /dev/kvm -a -w /dev/kvm
      - run: just verify native-qemu-guest-mechanics-kvm
  vm-runtime-acceptance:
    if: ${{ inputs.lane == 'vm-runtime' }}
    runs-on: dim-native-qemu
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0 (Node 20)
        with:
          version: 10.13.1
      - run: pnpm install --frozen-lockfile
      - run: just build-packages
      - name: Prepare and run exact VM runtime acceptance
        env:
          DIM_VM_ACCEPTANCE_ROOT: ${{ runner.temp }}/vm-runtime-acceptance
        run: just verify vm-runtime-prepare --run
      - name: Require exact-source runtime completion receipt
        env:
          DIM_VM_ACCEPTANCE_ROOT: ${{ runner.temp }}/vm-runtime-acceptance
        run: |
          node --input-type=module - "$DIM_VM_ACCEPTANCE_ROOT/acceptance.json" "$GITHUB_SHA" "$(git rev-parse 'HEAD^{tree}')" <<'JS'
          import { readFileSync } from 'node:fs';
          const value = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (value.outcome !== 'passed' || value.sourceSha !== process.argv[3] || value.sourceTree !== process.argv[4] || value.probe?.outcome !== 'passed-in-container-kvm-test') throw Error('required VM runtime coverage is missing or stale');
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: vm-runtime-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/vm-runtime-acceptance
          if-no-files-found: error
