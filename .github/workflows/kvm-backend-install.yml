name: KVM backend install

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  JUST_UNSTABLE: "1"

jobs:
  verify-backend-installers:
    runs-on: [self-hosted, linux, x64, kvm]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - run: command -v just
      - run: cd workbench && just ci kvm
