name: CI

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  source-compatibility:
    name: source compatibility (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Select pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - name: Select Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check source
        run: pnpm run workspace:check
      - name: Run source tests
        run: pnpm run workspace:test
