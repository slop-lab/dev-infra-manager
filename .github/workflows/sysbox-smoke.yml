name: Sysbox smoke

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  JUST_UNSTABLE: "1"

jobs:
  smoke:
    runs-on: [self-hosted, linux, sysbox]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: workbench/pnpm-lock.yaml
      - run: pnpm --dir workbench install --frozen-lockfile
      - run: cd workbench && just ci sysbox
