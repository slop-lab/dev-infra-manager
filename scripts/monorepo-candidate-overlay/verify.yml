name: Verify single-tree candidate

on:
  pull_request:
  push:
    branches: [main, candidate/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: dim
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ gitea.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate ancestry and overlay
        env:
          DIM_EXPECTED_CANDIDATE_SHA: ${{ gitea.sha }}
        run: node verification/scripts/monorepo-candidate-evidence.mjs "$DIM_EXPECTED_CANDIDATE_SHA" /tmp/dim-candidate-evidence.json
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.13.1
      - name: Provide host tool paths in the disposable source job
        run: |
          install -d /usr/bin
          for tool in git grep sort head cut; do
            ln -s -- "$(command -v "$tool")" "/usr/bin/$tool"
          done
      - name: Verify complete candidate source tree
        env:
          DIM_TEST_PTY_RESIZE: unsupported
        run: |
          source_tmp="$(mktemp -d /tmp/dim-candidate-source.XXXXXX)"
          chmod 1777 "$source_tmp"
          export TMPDIR="$source_tmp"
          pnpm install --frozen-lockfile
          just check-source
      - name: Upload exact-tree evidence
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: candidate-source-${{ gitea.sha }}
          path: |
            /tmp/dim-candidate-evidence.json
            .monorepo-candidate/sources.tsv
            .monorepo-candidate/github-development.tsv
            .monorepo-candidate/overlay.tsv
            .monorepo-candidate/overlay.digest
          retention-days: 30
