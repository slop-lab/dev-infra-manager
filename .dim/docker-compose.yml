services:
  private-docker:
    build:
      context: dind
    privileged: true
    command:
      - --host=unix:///run/user/1000/docker.sock
      - --host=tcp://0.0.0.0:2375
    environment:
      DOCKER_HOST: "tcp://127.0.0.1:2375"
      DOCKER_TLS_CERTDIR: ""
      DIM_WORKSPACE_NAME: "${DIM_WORKSPACE_NAME:?}"
      DIM_GIT_USERNAME: "${DIM_GIT_USERNAME:?}"
      DIM_GIT_TOKEN: "${DIM_GIT_TOKEN:?}"
      GIT_AUTHOR_NAME: "${GIT_AUTHOR_NAME:?}"
      GIT_AUTHOR_EMAIL: "${GIT_AUTHOR_EMAIL:?}"
      GIT_COMMITTER_NAME: "${GIT_COMMITTER_NAME:?}"
      GIT_COMMITTER_EMAIL: "${GIT_COMMITTER_EMAIL:?}"
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - ..:/workspace
      - "${DIM_PROJECT_MANIFEST:?}:/run/dim/project.json:ro"
      - agent-home:/mnt/agent-home
      - private-docker-data:/home/rootless/.local/share/docker
      - private-docker-shared:/mnt/workspace-shared-dind
    working_dir: /workspace

volumes:
  agent-home:
  private-docker-data:
  # Inner workloads may use different mapped UIDs. The private shared volume
  # therefore has a sticky writable root, and bind-source directories below it
  # must grant access to their intended containers.
  private-docker-shared:
