services:
  agent-dind:
    build:
      context: agent-dind
    privileged: true
    command:
      - --host=unix:///run/docker.sock
    environment:
      DOCKER_HOST: "unix:///run/docker.sock"
      DOCKER_TLS_CERTDIR: ""
      DIM_WORKSPACE_NAME: "${DIM_WORKSPACE_NAME:?}"
      DIM_GIT_USERNAME: "${DIM_GIT_USERNAME:?}"
      DIM_GIT_TOKEN: "${DIM_GIT_TOKEN:?}"
      GIT_AUTHOR_NAME: "${GIT_AUTHOR_NAME:?}"
      GIT_AUTHOR_EMAIL: "${GIT_AUTHOR_EMAIL:?}"
      GIT_COMMITTER_NAME: "${GIT_COMMITTER_NAME:?}"
      GIT_COMMITTER_EMAIL: "${GIT_COMMITTER_EMAIL:?}"
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - ../..:/workspace
      - "${DIM_PROJECT_MANIFEST:?}:/run/dim/project.json:ro"
      - agent-home:/mnt/agent-home
      - agent-dind-data:/var/lib/docker
      - agent-dind-shared:/mnt/workspace-shared-dind
    working_dir: /workspace

  secure-dind:
    profiles: [secure]
    build:
      context: secure-dind
    privileged: true
    command:
      - --host=unix:///run/user/1000/docker.sock
    environment:
      DOCKER_HOST: "unix:///run/user/1000/docker.sock"
      DOCKER_TLS_CERTDIR: ""
      DIM_WORKSPACE_NAME: "${DIM_WORKSPACE_NAME:?}"
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - secure-dind-data:/home/rootless/.local/share/docker
      - secure-dind-shared:/mnt/workspace-shared-dind

volumes:
  agent-home:
  agent-dind-data:
  # Inner workloads may use different mapped UIDs. The private shared volume
  # therefore has a sticky writable root, and bind-source directories below it
  # must grant access to their intended containers.
  agent-dind-shared:
  secure-dind-data:
  secure-dind-shared:
