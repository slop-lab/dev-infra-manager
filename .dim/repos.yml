schemaVersion: 1
repositories:
  main:
    ref: development
    defaultBranch: main
    protect: [main, development]
    branches:
      main: {review: true}
      development: {review: false}
    upstream:
      url: https://github.com/slop-lab/dev-infra-manager.git
      branch: development
    publish: {development: development}
policy:
  code-review:
    requiredReviewerIds: []
    pathReviewerRules:
      - pathPrefix: .dim/
        reviewerIds: [mjy]
  merge-policy: {}
  git-ci:
    ciRepositoryIds: [main]
    requiredJobs:
      - name: source
        kind: ordinary-sysbox
        evidenceClass: candidate-controlled
